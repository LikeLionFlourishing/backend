services:
  app:
    profiles: ["app"]
    build: .
    container_name: flourishing-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # 원문·커서와 Push 구독 비밀을 푸는 키. 값이 없으면 애플리케이션이 빈 생성 단계에서
      # 기동에 실패한다. 여기서 먼저 멈추게 해 두면 컨테이너 로그를 뒤지지 않아도 된다.
      # develop 기준으로는 아직 쓰이지 않지만, 기록 조회(#18)와 Push 알림(#19)이 들어오면
      # 둘 다 필수가 된다. 그때 원인을 찾는 것보다 지금 넣어 두는 편이 싸다.
      RECORD_DATA_ENCRYPTION_KEY: ${RECORD_DATA_ENCRYPTION_KEY:?RECORD_DATA_ENCRYPTION_KEY is required}
      PUSH_DATA_ENCRYPTION_KEY: ${PUSH_DATA_ENCRYPTION_KEY:?PUSH_DATA_ENCRYPTION_KEY is required}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/flourishing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_ALLOWED_ORIGINS: ${FRONTEND_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      mysql-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mysql-db:
    image: mysql:8.0
    container_name: flourishing-mysql
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: flourishing
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: flourishing-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
