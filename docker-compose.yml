services:
  app:
    profiles: ["app"]
    build: .
    container_name: flourishing-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/flourishing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_ALLOWED_ORIGINS: ${FRONTEND_ALLOWED_ORIGINS:-http://localhost:5173}
      # 기록 원문·커서와 Push 구독 비밀을 푸는 키. 값이 없으면 빈 생성 단계에서 기동에
      # 실패하므로 여기서 먼저 멈추게 한다. 컨테이너 로그를 뒤질 일이 없어진다.
      RECORD_DATA_ENCRYPTION_KEY: ${RECORD_DATA_ENCRYPTION_KEY:?RECORD_DATA_ENCRYPTION_KEY is required}
      PUSH_DATA_ENCRYPTION_KEY: ${PUSH_DATA_ENCRYPTION_KEY:?PUSH_DATA_ENCRYPTION_KEY is required}
      # VAPID 키가 없어도 앱은 뜨고 17:30 발송 작업만 건너뛴다.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # AI 키가 없으면 관리 설명 생성이 AI_NOT_CONFIGURED 로 떨어지고 규칙 문구로 대체된다.
      # 결과는 계속 나가므로 필수로 두지 않는다.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    depends_on:
      mysql-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mysql-db:
    image: mysql:8.0
    container_name: flourishing-mysql
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: flourishing
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: flourishing-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
