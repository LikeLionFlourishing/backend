spring:
  datasource:
    url: jdbc:h2:mem:flourishing;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  data:
    redis:
      repositories:
        enabled: false

app:
  cors:
    allowed-origins:
      - http://localhost:5173
