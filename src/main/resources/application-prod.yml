# 운영 프로파일. docker-compose.prod.yml 이 SPRING_PROFILES_ACTIVE=prod 로 켠다.
#
# 기본 application.yml 은 이미 운영 쪽을 향해 있다. 세션 쿠키가 __Host- 접두사에 Secure=true 다.
# 그래서 여기서는 값을 다시 정하지 않고, 개발 편의를 위해 켜 둔 것들만 끈다.

spring:
  jpa:
    # 운영에서는 쿼리를 찍지 않는다. 정렬된 SQL 을 만드는 비용도 들지 않게 한다.
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# API 문서는 기본으로 닫는다. SecurityConfig 의 PUBLIC_PATHS 에 swagger 경로가 있어 애플리케이션
# 쪽에서는 인증을 걸 수 없다. 켜야 할 때는 API_DOCS_ENABLED=true 로 올리는데, 그때도 프록시의
# Basic 인증이 앞을 막는다(Caddyfile 의 @docs 규칙). 저장소의 docs/openapi.generated.json 으로
# 충분하면 켜지 않는 편이 낫다.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

logging:
  level:
    root: info
    # 기본 프로파일은 debug 다. 켜 두면 모든 쿼리가 로그로 나가 디스크를 채우고,
    # 파라미터 바인딩까지 남는 설정으로 잘못 올리면 개인정보가 로그에 들어갈 길이 생긴다.
    org.hibernate.SQL: warn
    likelion.flourishing: info
