spring:
  application:
    name: flourishing-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/flourishing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # API 명세의 모든 요청 스키마가 additionalProperties: false이므로 정의되지 않은 필드를 거부한다.
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

app:
  cors:
    allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173}

  problem:
    base-uri: ${PROBLEM_BASE_URI:https://api.example.invalid/problems}

  auth:
    session:
      # __Host- 접두사는 Secure와 Path=/를 요구한다. HTTP로 띄우는 로컬은 local 프로파일이 낮춘다.
      cookie-name: ${SESSION_COOKIE_NAME:__Host-session}
      secure: ${SESSION_COOKIE_SECURE:true}
      same-site: Lax
      ttl: 14d
    rate-limit:
      register:
        limit: 10
        window: 1h
      login-per-ip:
        limit: 20
        window: 10m
      login-per-email:
        limit: 10
        window: 10m

  records:
    crypto:
      # 32바이트 마스터 키를 Base64로 인코딩한 값.
      # 원문 암호화 키, 커서 서명 키, 멱등 응답 암호화 키를 목적별로 분리 파생한다.
      master-key: ${RECORD_DATA_ENCRYPTION_KEY:}

  ai:
    openai:
      # 키나 모델이 비어 있으면 애플리케이션은 뜨고 AI 호출만 실패로 처리한다.
      # 구조화는 실패해도 사용자가 직접 고르면 진행되고, 관리 설명은 승인된 대체 문구로 저장된다.
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:}
      # 사용자를 기다리게 하는 화면 앞단 호출이라 오래 붙잡지 않고 실패로 돌린다.
      connect-timeout: 3s
      read-timeout: 8s
      max-output-tokens: 800
      # 구조화는 사용자가 한 화면에서 여러 번 부를 수 있고 호출마다 외부 비용이 든다.
      # 보고 생성과 설명 재생성은 하루 한 건·결과당 한 번으로 자연히 묶이므로 이 경로만 제한한다.
      rate-limit:
        limit: 30
        window: 1h

  notifications:
    crypto:
      # 32바이트 마스터 키를 Base64로 인코딩한 값. 구독 암호화 키와 endpoint 지문 키를 분리 파생한다.
      master-key: ${PUSH_DATA_ENCRYPTION_KEY:}
    push:
      vapid:
        # 비압축 65바이트 공개키와 32바이트 비밀키를 각각 패딩 없는 base64url로 인코딩한 값.
        # 비어 있으면 애플리케이션은 뜨고 17:30 발송 작업만 건너뛴다.
        public-key: ${VAPID_PUBLIC_KEY:}
        private-key: ${VAPID_PRIVATE_KEY:}
        subject: ${VAPID_SUBJECT:}
      ttl: 1h
      connect-timeout: 3s
      read-timeout: 5s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: debug
