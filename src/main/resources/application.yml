spring:
  application:
    name: flourishing-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/flourishing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # API 명세의 모든 요청 스키마가 additionalProperties: false이므로 정의되지 않은 필드를 거부한다.
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

app:
  cors:
    allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173}

  problem:
    base-uri: ${PROBLEM_BASE_URI:https://api.example.invalid/problems}

  auth:
    session:
      # __Host- 접두사는 Secure와 Path=/를 요구한다. HTTP로 띄우는 로컬은 local 프로파일이 낮춘다.
      cookie-name: ${SESSION_COOKIE_NAME:__Host-session}
      secure: ${SESSION_COOKIE_SECURE:true}
      # 프런트엔드가 다른 등록 도메인에 있으면 Lax 쿠키는 fetch에 실리지 않는다.
      # 그 배포에서는 None으로 올린다(브라우저가 Secure를 함께 요구한다).
      same-site: ${SESSION_COOKIE_SAME_SITE:Lax}
      ttl: 14d
    rate-limit:
      register:
        limit: 10
        window: 1h
      login-per-ip:
        limit: 20
        window: 10m
      login-per-email:
        limit: 10
        window: 10m

  records:
    crypto:
      # 32바이트 마스터 키를 Base64로 인코딩한 값. 원문 암호화 키와 커서 서명 키를 분리 파생한다.
      master-key: ${RECORD_DATA_ENCRYPTION_KEY:}

  notifications:
    crypto:
      # 32바이트 마스터 키를 Base64로 인코딩한 값. 구독 암호화 키와 endpoint 지문 키를 분리 파생한다.
      master-key: ${PUSH_DATA_ENCRYPTION_KEY:}
    push:
      vapid:
        # 비압축 65바이트 공개키와 32바이트 비밀키를 각각 패딩 없는 base64url로 인코딩한 값.
        # 비어 있으면 애플리케이션은 뜨고 17:30 발송 작업만 건너뛴다.
        public-key: ${VAPID_PUBLIC_KEY:}
        private-key: ${VAPID_PRIVATE_KEY:}
        subject: ${VAPID_SUBJECT:}
      ttl: 1h
      connect-timeout: 3s
      read-timeout: 5s
      # 등록을 허용하는 push 서비스 호스트. endpoint는 사용자 입력이고 그 주소로 서버가 요청을
      # 보내므로 SSRF를 막기 위해 대상을 좁힌다. 목록을 비우면 사설·loopback 대역만 막는다.
      allowed-endpoint-hosts:
        - fcm.googleapis.com
        - push.services.mozilla.com
        - web.push.apple.com
        - notify.windows.com

  onboarding:
    # 지금 받고 있는 동의서 버전. 요청이 이 값과 다르면 동의를 저장하지 않는다.
    # 문구가 바뀌면 이 값을 올려 예전 버전으로 오는 요청이 새 동의를 다시 받게 한다.
    # 두 문구는 따로 개정될 수 있어 버전도 따로 둔다.
    consent-version: ${ONBOARDING_CONSENT_VERSION:2026-08-16}
    notification-consent-version: ${ONBOARDING_NOTIFICATION_CONSENT_VERSION:2026-08-16}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: debug
