spring:
  application:
    name: flourishing-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/flourishing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # API 명세의 모든 요청 스키마가 additionalProperties: false이므로 정의되지 않은 필드를 거부한다.
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

app:
  cors:
    allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173}

  problem:
    base-uri: ${PROBLEM_BASE_URI:https://api.example.invalid/problems}

  auth:
    session:
      # __Host- 접두사는 Secure와 Path=/를 요구한다. HTTP로 띄우는 로컬은 local 프로파일이 낮춘다.
      cookie-name: ${SESSION_COOKIE_NAME:__Host-session}
      secure: ${SESSION_COOKIE_SECURE:true}
      same-site: Lax
      ttl: 14d
    rate-limit:
      register:
        limit: 10
        window: 1h
      login-per-ip:
        limit: 20
        window: 10m
      login-per-email:
        limit: 10
        window: 10m

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: debug
