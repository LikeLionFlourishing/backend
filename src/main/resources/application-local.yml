spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/flourishing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  auth:
    session:
      # 로컬은 HTTP라 Secure 쿠키를 브라우저가 저장하지 않으므로 __Host- 접두사를 뗀다.
      cookie-name: ${SESSION_COOKIE_NAME:session}
      secure: ${SESSION_COOKIE_SECURE:false}
